# Included inside the existing edge nginx http block.
# Keep the existing direct :5000 BlockMiner endpoint unchanged.
map $http_host $herobits_target {
  default herobits-web:80;
  ~:5000$ app:3000;
}
server {
  listen 5100;
  server_name 5.189.157.88;
  client_max_body_size 16k;
  location / {
    proxy_pass http://$herobits_target$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
