# HTTP bootstrap for bombherobits.pro, included in the shared edge http block.
server {
    listen 5100;
    server_name bombherobits.pro;
    client_max_body_size 16k;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/ssl/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        set $hb_domain_web "herobits-web:80";
        proxy_pass http://$hb_domain_web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
