# Dedicated certificate and routing for Hero Bits; other edge virtual hosts stay intact.
server {
    listen 5100;
    server_name bombherobits.pro;
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/ssl/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://bombherobits.pro$request_uri; }
}
server {
    listen 5443 ssl;
    server_name bombherobits.pro;
    ssl_certificate /etc/nginx/ssl/herobits/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/herobits/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HEROBITS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 16k;
    location / {
        set $hb_domain_web "herobits-web:80";
        proxy_pass http://$hb_domain_web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
