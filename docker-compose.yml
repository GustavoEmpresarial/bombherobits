services:
  postgres:
    image: postgres:16-alpine
    container_name: herobits-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: herobits
      POSTGRES_PASSWORD: herobits
      POSTGRES_DB: herobits
    volumes:
      - herobits_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herobits -d herobits"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  herobits_pg:
